[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "neuralforge"
version = "0.1.0"
description = "A cutting-edge toolkit for neural network experimentation"
readme = "README.md"
authors = [
    {name = "Leandro", email = "your-email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["neural networks", "machine learning", "deep learning", "ai"]
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.910",
    "pre-commit>=2.17",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8",
]
[project.urls]
Homepage = "https://github.com/leandro4979-hub/neuralforge"
Documentation = "https://leandro4979-hub.github.io/neuralforge"
Repository = "https://github.com/leandro4979-hub/neuralforge"
Issues = "https://github.com/leandro4979-hub/neuralforge/issues"
[tool.black]
line-length = 88
target-version = ['py38']
[tool.isort]
profile = "black"
line_length = 88
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
